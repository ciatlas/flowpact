# Lockfile entries of real releases, as `flowpact remotes update` writes them (`lockEntryOf` of each tag's action.yml),
# recorded 2026-10-14 for the grader's tests (remotes-grade.test.ts). Each pair is a version change callers met:
# setup-node 6.1.0 dropped always-auth, create-github-app-token 3.3.0 dropped permission-team-discussions, setup-python
# v7 dropped pip-install, and checkout's v4 tag moved from 4.3.1 to a commit that only adds an input.
actions/setup-node:
  v6.0.0:
    sha: 2028fbc5c25fe9cf00d9f06a71cc4710d4507903
    kind: action
    using: node24
    inputs:
      always-auth:
        default: 'false'
      node-version: {}
      node-version-file: {}
      architecture: {}
      check-latest:
        default: false
      registry-url: {}
      scope: {}
      token:
        default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
      cache: {}
      package-manager-cache:
        default: true
      cache-dependency-path: {}
      mirror: {}
      mirror-token: {}
    outputs:
      - cache-hit
      - node-version
