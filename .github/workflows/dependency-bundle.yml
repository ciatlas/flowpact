name: Dependency updates
# Runtime dependencies are compiled into the committed action bundle, which Renovate cannot rebuild. The release bot
# rebuilds it on Renovate's branches; its commits start CI like any other push.
#
# Two jobs, so the branch's code never runs next to a write token: `build` installs and builds with a read-only token
# and no secrets; `commit` holds the release bot's token and only runs git on the bundle `build` produced.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-bundle-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild the action bundle
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowpact/action build
      - id: diff
        name: Check whether the bundle changed
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-bundle
          path: packages/action/dist/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit the rebuilt bundle
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      # The commit the bundle was built from, checked out only to commit onto it: no step below runs anything from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: action-bundle
          path: ${{ runner.temp }}/action-bundle
      - name: Commit and push the bundle
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          BUILT_FROM: ${{ github.event.pull_request.head.sha }}
        run: |
          # The bundle belongs to the commit it was built from; a newer push starts its own run. The push below is a
          # fast-forward of exactly that commit, so it is also refused if the branch moves in the meantime.
          if [ "$(git ls-remote origin "refs/heads/$GITHUB_HEAD_REF" | cut -f1)" != "$BUILT_FROM" ]; then
            echo "The branch moved since $BUILT_FROM; the run for the new head rebuilds the bundle."
            exit 0
          fi
          rm -rf packages/action/dist
          cp -R "$RUNNER_TEMP/action-bundle" packages/action/dist
          if [ -z "$(git status --porcelain packages/action/dist)" ]; then
            echo "The bundle is already up to date."
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git add packages/action/dist
          git -c core.hooksPath=/dev/null commit -m "build(action): rebuild the bundle for the dependency update"
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
