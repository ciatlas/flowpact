name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    uses: ./.github/workflows/publish.yml
  docs:
    needs: publish
    uses: acme/pages/.github/workflows/deploy.yml@v2
    permissions:
      contents: read
      pages: write
